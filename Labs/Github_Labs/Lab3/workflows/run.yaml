name: Automated ML Training, Validation and GCS Artifact Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Labs/Github_Labs/Lab3/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Labs/Github_Labs/Lab3/**'
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allow manual triggering

jobs:
  train_validate_and_deploy:
    name: Train, Test & Export Model
    runs-on: ubuntu-latest
    env:
      GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME || 'mlops-github-actions-harshitha' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'Labs/Github_Labs/Lab3/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Labs/Github_Labs/Lab3/requirements.txt

      - name: Code Quality & Lint Check
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 Labs/Github_Labs/Lab3 --count --select=E9,F63,F7,F82 --show-source --statistics
          # Check style rules (max-line-length=88 for modern standards)
          flake8 Labs/Github_Labs/Lab3 --count --max-line-length=88 --statistics

      - name: Run Unit Tests & Benchmark Validation
        run: |
          pytest Labs/Github_Labs/Lab3/test_train.py -v

      - name: Authenticate to Google Cloud Platform
        id: gcp-auth
        if: env.GCP_SA_KEY != ''
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
        continue-on-error: true

      - name: Train and Export Model Artifacts
        run: |
          python Labs/Github_Labs/Lab3/train_and_save_model.py

      - name: Upload Model & Metadata as CI Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trained-model-artifacts
          path: artifacts/
          retention-days: 14
